<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
            font-weight: 500;
            letter-spacing: 1px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.9;
        }

        main {
            padding: 40px;
        }
    </style>
</head>
<body>

<header>
    <h2>Hospital Management</h2>
    <a href="{% url 'logout_page' %}">Logout</a>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
