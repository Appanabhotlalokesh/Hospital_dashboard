{% extends "base.html" %}

{% block title %}Appointments Calendar{% endblock %}

{% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<style>
  #calendar { max-width: 900px; margin: 0 auto; background: white; padding: 12px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>📅 My Appointments</h1>
  <a href="{% url 'view_doctors' %}" class="btn btn-outline-primary">Book New Appointment</a>
</div>

<div id="calendar"></div>

{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const events = JSON.parse('{{ events_json|escapejs }}');

    var calendarEl = document.getElementById('calendar');

    var calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,timeGridDay'
      },
      events: events,
      eventClick: function(info) {
        const evt = info.event;
        if (evt.extendedProps.status === 'confirmed') {
          if (confirm('Cancel this appointment with ' + evt.title + '?')) {
            // Build cancel URL using Django reverse for id 0 then replace 0
            const cancelTemplate = "{% url 'cancel_appointment' 0 %}";
            const url = cancelTemplate.replace('/0/', '/' + evt.id + '/');
            window.location.href = url;
          }
        } else {
          alert('Appointment status: ' + evt.extendedProps.status);
        }
      }
    });

    calendar.render();
  });
</script>
{% endblock %}
